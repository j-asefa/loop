name: Docker with a shared build/image store
description: Enable GitHub cache support without exporting and reimporting test images
runs:
  using: composite
  steps:
    - name: Enable the containerd image store
      shell: bash
      run: |
        # This job owns a fresh hosted runner; no containers are running yet.
        sudo python3 - <<'PYTHON'
        import json
        from pathlib import Path
        path = Path("/etc/docker/daemon.json")
        config = json.loads(path.read_text()) if path.exists() else {}
        config.setdefault("features", {})["containerd-snapshotter"] = True
        path.write_text(json.dumps(config))
        PYTHON
        sudo systemctl restart docker
        docker info --format '{{json .DriverStatus}}'
    - uses: docker/setup-buildx-action@v3
      with:
        # Build directly into the daemon store. A separate builder plus --load
        # copies multi-GB images twice before the smoke tests can even start.
        driver: docker
