name: Locked Node dependencies
description: Restore the shared npm download cache; one job saves it on a miss.
inputs:
  save-cache:
    description: Save downloaded packages after a successful install
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: "24"
    - id: npm
      shell: bash
      run: echo "path=$(npm config get cache)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache/restore@v4
      id: cache
      with:
        path: ${{ steps.npm.outputs.path }}
        key: npm-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('package-lock.json') }}
    - shell: bash
      run: npm ci --no-audit --no-fund
    - uses: actions/cache/save@v4
      if: inputs.save-cache == 'true' && steps.cache.outputs.cache-hit != 'true'
      with:
        path: ${{ steps.npm.outputs.path }}
        key: npm-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('package-lock.json') }}
