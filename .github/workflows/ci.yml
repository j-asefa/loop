name: Loop checks
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run setup
      - run: npm run build
      - run: npm run test:all
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run smoke:design
      - run: npm run smoke:companion
      - run: LOOP_BROWSER=webkit npm run smoke:companion
      - run: npm run smoke:package
      - run: npm run smoke:browser
      - run: LOOP_BROWSER=webkit npm run smoke:browser
      - run: npm run smoke:journey
      - run: LOOP_BROWSER=webkit npm run smoke:journey
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loop-browser-evidence
          path: docs/loop-v0/evidence/*.png

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx expo export --platform ios --output-dir dist/ios
      - run: npx expo export --platform android --output-dir dist/android

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node scripts/setup.mjs
      - run: docker compose config --quiet
      - run: docker compose up --build -d
      - run: node scripts/compose-smoke.mjs
      - run: docker run --rm --network none --entrypoint node -i loop-runtime:0.2 --input-type=module < scripts/native-harness-smoke.mjs
      - run: >-
          docker run --rm --network none --entrypoint node
          --mount type=bind,source=${{ github.workspace }}/scripts/shared-codex-smoke.mjs,target=/scripts/shared-codex-smoke.mjs,readonly
          loop-runtime:0.2 /scripts/shared-codex-smoke.mjs
      - run: node scripts/managed-workspace-smoke.mjs
      - if: failure()
        run: docker compose logs --tail=100 loop runtime-broker runtime-image
      - if: always()
        run: docker compose down -v --remove-orphans

  native-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: docker build -f deployment/Dockerfile.native -t loop-architecture-native:validation .
      - run: node scripts/native-transport-smoke.mjs
      - run: docker run --rm --network none loop-architecture-native:validation node /opt/loop-native/compatibility.mjs

