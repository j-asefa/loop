name: Loop checks
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run setup
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke:browser
      - run: npm run smoke:journey
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loop-browser-evidence
          path: docs/loop-v0/evidence/*.png

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/setup.mjs
      - run: docker compose config --quiet
      - run: docker compose up --build -d
      - run: node scripts/compose-smoke.mjs
      - if: failure()
        run: docker compose logs --tail=100 loop runtime-broker runtime-image
      - if: always()
        run: docker compose down -v --remove-orphans
