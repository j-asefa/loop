name: Loop checks

on:
  pull_request:
  # No run on pushes to main while the repository is private (Actions minutes
  # are billed); restore `push: branches: [main]` when it goes public.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CPU fixtures use bundled ONNX binaries; avoid optional CUDA/NuGet downloads.
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: npm ci
      # A build creates dist/ and npm-shrinkwrap.json; check the clean source tree.
      - run: npm run check
