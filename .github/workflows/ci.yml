name: Loop checks
on:
  pull_request:
  workflow_dispatch:
    inputs:
      browser_workers:
        description: Design scenario workers per engine (full validation always runs)
        type: choice
        options: ["auto", "2", "1"]
        default: "auto"
  schedule:
    - cron: "17 4 * * *"
  # Seed default-branch caches when build inputs change; ordinary feature merges
  # do not duplicate their entire PR run. Scheduled/manual runs also seed caches.
  push:
    branches: [main]
    paths:
      - "package*.json"
      - "Dockerfile*"
      - "docker-bake.hcl"
      - "deployment/**"
      - "native/**"
      - "src/hapi-build.ts"
      - ".github/**"
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
env:
  # Hosted runners use CPU inference; optional CUDA downloads add a flaky NuGet dependency.
  ONNXRUNTIME_NODE_INSTALL: skip
  DOCKER_BUILD_RECORD_RETENTION_DAYS: 7
  CACHE_WRITE: ${{ github.event_name != 'pull_request' && 'true' || 'false' }}
jobs:
  # Docs-only PRs skip the jobs below. A job skipped by its condition reports
  # success, so this stays mergeable if these checks become required.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      containers: ${{ steps.diff.outputs.containers }}
      companion: ${{ steps.diff.outputs.companion }}
      native: ${{ steps.diff.outputs.native }}
      service: ${{ steps.diff.outputs.service }}
      browser_image: ${{ steps.diff.outputs.browser_image }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test scripts/ci/*.test.mjs
      - id: diff
        run: node scripts/ci/changes.mjs

  # Unit tests, browser smokes and the package smoke run in parallel jobs;
  # each browser engine gets its own job.
  verify:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/node
        with:
          save-cache: "true"
      - run: npm run setup
      - run: npm run build
      - run: npm run test:all

  browser:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      LOOP_BROWSER: ${{ matrix.browser }}
      LOOP_BROWSER_WORKERS: ${{ inputs.browser_workers && inputs.browser_workers != 'auto' && inputs.browser_workers || (matrix.browser == 'webkit' && '1' || '2') }}
      LOOP_CI_BROWSER_IMAGE: ${{ needs.changes.outputs.browser_image }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/node
      - run: npm run setup
      - run: npm run build
      - name: Pull locked browser image
        run: docker pull "$LOOP_CI_BROWSER_IMAGE"
      - name: Verify preinstalled browser and runtime
        run: bash scripts/ci/browser-container.sh node scripts/ci/check-browser-image.mjs
      - run: bash scripts/ci/browser-container.sh npm run smoke:workspace
      - run: bash scripts/ci/browser-container.sh npm run smoke:html
      - run: bash scripts/ci/browser-container.sh npm run smoke:pulls
      - run: bash scripts/ci/browser-container.sh npm run smoke:design
      - run: bash scripts/ci/browser-container.sh npm run smoke:history
      - run: bash scripts/ci/browser-container.sh npm run smoke:companion
      - run: bash scripts/ci/browser-container.sh npm run smoke:reconnect
      - run: bash scripts/ci/browser-container.sh npm run smoke:browser
      - run: bash scripts/ci/browser-container.sh npm run smoke:journey
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loop-browser-evidence-${{ matrix.browser }}
          path: docs/loop-v0/evidence/*.png
          retention-days: 7

  package:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/node
      - run: npm run setup
      # The smoke builds and packs the tarball itself.
      - run: npm run smoke:package

  containers:
    needs: changes
    if: needs.changes.outputs.containers == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node scripts/setup.mjs
      - uses: ./.github/actions/docker
      - uses: docker/bake-action@v6
        with:
          files: docker-bake.hcl
          targets: server-stack
      - run: docker compose -f compose.yaml -f scripts/ci/server-images.yaml config --quiet
      - run: docker compose -f compose.yaml -f scripts/ci/server-images.yaml up --no-build -d
      - run: node scripts/compose-smoke.mjs
      - run: docker run --rm --network none --entrypoint node -i loop-runtime:0.2 --input-type=module < scripts/native-harness-smoke.mjs
      - run: >-
          docker run --rm --network none --entrypoint node
          --mount type=bind,source=${{ github.workspace }}/scripts/shared-codex-smoke.mjs,target=/scripts/shared-codex-smoke.mjs,readonly
          loop-runtime:0.2 /scripts/shared-codex-smoke.mjs
      - run: node scripts/managed-workspace-smoke.mjs
      - if: failure()
        run: docker compose logs --tail=100 loop runtime-broker runtime-image
      - if: always()
        run: docker compose down -v --remove-orphans

  # Real user systemd units: application restarts keep the connection unit,
  # its cloudflared and the Quick Tunnel address. macOS launchd has no CI job.
  service-lifecycle:
    needs: changes
    if: needs.changes.outputs.service == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/node
      - run: npm run build
      - name: Start a user systemd manager
        run: |
          sudo loginctl enable-linger "$USER"
          uid=$(id -u)
          for i in $(seq 1 30); do [ -S "/run/user/$uid/bus" ] && break; sleep 1; done
          echo "XDG_RUNTIME_DIR=/run/user/$uid" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$uid/bus" >> "$GITHUB_ENV"
      - run: node scripts/service-lifecycle-smoke.mjs
      - if: failure()
        run: journalctl --user -n 200 --no-pager -u loop.service -u loop-connection.service || true

  companion-container:
    # Keep the two deployment builds off the same disk: the guarded runtime
    # build exhausted the hosted runner after the server images were built.
    # Separate jobs get separate runners, so this runs alongside containers.
    needs: changes
    if: needs.changes.outputs.companion == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim hosted runner disk for native source builds
        # The companion bakes both guarded OpenCode and HAPI. Its source-build
        # peak exceeds the default free disk on the preloaded Ubuntu image.
        # This isolated job uses none of the Android, .NET, Haskell or CodeQL SDKs.
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: ./.github/actions/docker
      - uses: docker/bake-action@v6
        with:
          files: docker-bake.hcl
          targets: companion-stack
      - run: node scripts/compose-companion-smoke.mjs --prebuilt
      - if: always()
        run: df -h /

  native-contract:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim disk for native source builds
        # Cold source builds need the same headroom as companion.
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: ./.github/actions/node
      - uses: ./.github/actions/docker
      - uses: docker/bake-action@v6
        with:
          files: docker-bake.hcl
          targets: native
      - name: Patched OpenCode ACP boundaries
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          hapi_fixture=$(mktemp -d)
          trap 'rm -rf "$hapi_fixture"' EXIT
          git -C "$hapi_fixture" init
          git -C "$hapi_fixture" remote add origin https://github.com/tiann/hapi.git
          hapi_commit=$(node -p 'require("./deployment/versions.json").hapiCommit')
          git -C "$hapi_fixture" fetch --depth=1 origin "$hapi_commit"
          git -C "$hapi_fixture" checkout --detach FETCH_HEAD
          node native/apply-hapi-patch.mjs "$hapi_fixture"
          node native/check-codex-mcp-approvals.mjs "$hapi_fixture"
          node --import tsx native/check-opencode-launch.mjs "$hapi_fixture"
          node native/check-opencode-http.mjs "$hapi_fixture"
          node native/check-pi-transport.mjs "$hapi_fixture"
          node native/check-pi-lifecycle.mjs "$hapi_fixture"
      - run: node scripts/native-transport-smoke.mjs
      - run: docker run --rm --network none loop-architecture-native:validation node /opt/loop-native/compatibility.mjs

      - name: Guarded OpenCode shipped runner compatibility
        timeout-minutes: 5
        run: docker run --rm --network none loop-architecture-native:validation node /opt/loop-native/check-opencode-discovery.mjs /usr/local/bin/opencode /opt/loop-native/generated/native-auth/service.mjs

      - name: Pi shipped runner compatibility
        timeout-minutes: 5
        run: docker run --rm --network none loop-architecture-native:validation node /opt/loop-native/check-pi-discovery.mjs /opt/native/node_modules/.bin/pi /opt/loop-native/generated/native-auth/service.mjs
      - name: Pi shipped workspace tools
        timeout-minutes: 5
        run: docker run --rm --network none loop-architecture-native:validation node /opt/loop-native/check-pi-managed-tools.mjs /opt/native/node_modules/.bin/pi /opt/loop-native/generated/pi-managed-extension.mjs

  ci-success:
    if: always()
    needs:
      [
        changes,
        verify,
        browser,
        package,
        containers,
        companion-container,
        native-contract,
        service-lifecycle,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Require all selected checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node - <<'JS'
          const jobs = JSON.parse(process.env.RESULTS);
          if (jobs.changes.result !== 'success') process.exit(1);
          const outputs = jobs.changes.outputs;
          const flags = { verify: 'code', browser: 'code', package: 'code', containers: 'containers',
            'companion-container': 'companion', 'native-contract': 'native', 'service-lifecycle': 'service' };
          for (const [name, flag] of Object.entries(flags)) {
            const expected = outputs[flag] === 'true' ? 'success' : 'skipped';
            if (jobs[name].result !== expected) {
              console.error(`${name}: expected ${expected}, got ${jobs[name].result}`);
              process.exitCode = 1;
            }
          }
          JS
