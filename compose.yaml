services:
  loop55:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      LOOP55_LISTEN_HOST: "0.0.0.0"
      LOOP55_LOOPBACK_PROXY: "${LOOP55_LOOPBACK_PROXY:-1}"
      LOOP55_BIND_ADDRESS: "${LOOP55_BIND_ADDRESS:-127.0.0.1}"
      LOOP55_BEHIND_PROXY: "${LOOP55_BEHIND_PROXY:-0}"
      LOOP55_URL: "${LOOP55_URL:-http://localhost:3000}"
      LOOP55_RUNTIME_URL: http://runtime-broker:3100
      LOOP55_RUNTIME_TOKEN: "${LOOP55_RUNTIME_TOKEN:?Run node scripts/setup.mjs}"
      LOOP55_DATA_DIR: /data
      PORT: 3000
    volumes:
      - loop55-data:/data
    ports:
      - "${LOOP55_BIND_ADDRESS:-127.0.0.1}:${LOOP55_PORT:-3000}:3000"
    depends_on:
      runtime-broker:
        condition: service_started
  runtime-image:
    image: "${LOOP55_RUNTIME_IMAGE:-loop55-runtime:0.2}"
    build:
      context: .
      dockerfile: Dockerfile.runtime
    network_mode: none
    command: ["node", "--version"]
  runtime-broker:
    build:
      context: .
      dockerfile: Dockerfile.runtime-broker
    restart: unless-stopped
    environment:
      LOOP55_RUNTIME_TOKEN: "${LOOP55_RUNTIME_TOKEN:?Run node scripts/setup.mjs}"
      LOOP55_RUNTIME_IMAGE: "${LOOP55_RUNTIME_IMAGE:-loop55-runtime:0.2}"
      LOOP55_MCP_IMAGE: "${LOOP55_MCP_IMAGE:-loop55-mcp:0.1}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      runtime-image:
        condition: service_completed_successfully
      mcp-image:
        condition: service_completed_successfully
  mcp-image:
    image: "${LOOP55_MCP_IMAGE:-loop55-mcp:0.1}"
    build:
      context: .
      dockerfile: Dockerfile.mcp
    network_mode: none
    command: ["node", "--version"]
  https:
    profiles: [https]
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      LOOP55_HOST: "${LOOP55_HOST:-localhost}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - loop55
volumes:
  loop55-data:
    name: "${LOOP55_DATA_VOLUME:-${COMPOSE_PROJECT_NAME}_loop55-data}"
  caddy-data:
  caddy-config:
