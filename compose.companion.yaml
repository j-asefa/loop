# Deliberately separate from compose.yaml: no server secrets or server services.
# loop55-connection owns cloudflared and the relay; it keeps the public address
# while loop55-companion restarts or is replaced. Update the application alone:
#   docker compose -f compose.companion.yaml up -d --build --no-deps loop55-companion
# `down` stops both (a new Quick Tunnel address); omit -v to keep your data.
services:
  loop55-connection:
    build:
      context: .
      dockerfile: Dockerfile.connection
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
    volumes:
      - loop55-companion-connection:/data/loop55-connection
  loop55-companion:
    build:
      context: .
      dockerfile: Dockerfile.companion
    init: true
    restart: unless-stopped
    stop_grace_period: 40s
    # Started, not healthy: the application waits for the tunnel itself, and
    # the connection never waits for the application.
    depends_on:
      - loop55-connection
    environment:
      LOOP55_CONNECTION_DIR: /data/loop55-connection
      LOOP55_CONNECTION_MANAGED: external
      LOOP55_ENVIRONMENT_NAME: "${LOOP55_ENVIRONMENT_NAME:-${COMPOSE_PROJECT_NAME}/loop55-companion}"
    volumes:
      - loop55-companion-data:/data/loop55
      - loop55-companion-projects:/workspaces
      - loop55-companion-connection:/data/loop55-connection
volumes:
  loop55-companion-data:
    name: "${LOOP55_COMPANION_DATA_VOLUME:-${COMPOSE_PROJECT_NAME}_loop55-companion-data}"
  loop55-companion-projects:
    name: "${LOOP55_COMPANION_PROJECTS_VOLUME:-${COMPOSE_PROJECT_NAME}_loop55-companion-projects}"
  loop55-companion-connection:
    name: "${LOOP55_COMPANION_CONNECTION_VOLUME:-${COMPOSE_PROJECT_NAME}_loop55-companion-connection}"
