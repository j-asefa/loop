services:
  loop:
    image: loop-app:local
    build:
      context: .
      dockerfile: deployment/Dockerfile.app
    env_file:
      - ./.env
      - ./.local-native/app.env
    environment:
      LOOP_NATIVE_ADMISSION: "1"
      LOOP_LISTEN_HOST: 0.0.0.0
    command: ["node", "deployment/start-app.mjs"]
    volumes:
      - ./.local-native/secrets/app:/run/loop/private:ro
      - loop-data:/data
    networks: [default, control, memory]
    depends_on:
      hapi:
        condition: service_started
      memory:
        condition: service_started

  queue:
    image: loop-app:local
    pull_policy: never
    restart: unless-stopped
    env_file:
      - ./.env
      - ./.local-native/app.env
    environment:
      LOOP_DATA_DIR: /data
      LOOP_NATIVE_ADMISSION: "1"
    command: ["node", "deployment/start-queue.mjs"]
    healthcheck:
      disable: true
    volumes:
      - loop-data:/data
      - ./.local-native/secrets/app:/run/loop/private:ro
    networks: [default, control, memory]
    depends_on:
      loop:
        condition: service_started

  gateway:
    image: loop-app:local
    pull_policy: never
    env_file:
      - ./.env
      - ./.local-native/app.env
    command: ["node", "--import", "tsx", "src/server/hapi/private.ts"]
    healthcheck:
      disable: true
    environment:
      LOOP_PRIVATE_HOST: 0.0.0.0
    volumes:
      - ./.local-native/secrets/app:/run/loop/private:ro
      - loop-data:/data
    networks: [control]
    depends_on:
      loop:
        condition: service_started

  hapi:
    image: loop-native:local
    platform: linux/amd64
    build:
      context: .
      dockerfile: deployment/Dockerfile.native
    command: ["hapi", "hub", "--no-relay"]
    environment:
      HAPI_LISTEN_HOST: 0.0.0.0
      HAPI_PUBLIC_URL: http://hapi:3006
    env_file:
      - ./.local-native/hub.env
    volumes:
      - hapi-data:/home/agent/.hapi
    networks: [control]

  runner:
    mem_limit: 4g
    cpus: 2
    pids_limit: 256
    image: loop-native:local
    pull_policy: never
    platform: linux/amd64
    restart: unless-stopped
    env_file:
      - ./.local-native/worker.env
    environment:
      LOOP_EXECUTION_KIND: docker
      LOOP_WORKER_CONFIG: /config/worker.json
      LOOP_LAUNCH_DIR: /home/agent/.loop-launches
      LOOP_PROJECT_ROOT: /workspaces
    volumes:
      - worker-home:/home/agent
      - worker-projects:/workspaces
      - ./.local-native/secrets/worker:/config:ro
    networks: [control]
    depends_on:
      hapi:
        condition: service_started
      gateway:
        condition: service_started

  memory:
    build:
      context: .
      dockerfile: deployment/Dockerfile.memory
    volumes:
      - memory-data:/data
      - ./.local-native/secrets/memory/token:/run/memory/token:ro
    environment:
      LOOP_MEMORY_TOKEN_FILE: /run/memory/token
    networks: [memory]

networks:
  control:
    internal: true
  memory:
    internal: true

volumes:
  loop-data:
    name: loop-local-native-data
  hapi-data:
  worker-home:
  worker-projects:
  memory-data:
