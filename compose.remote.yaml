# Start the broker on your remote machine, then reach it through SSH or private HTTPS.
services:
  runtime-image:
    image: "${LOOP_RUNTIME_IMAGE:-loop-runtime:0.2}"
    build:
      context: .
      dockerfile: Dockerfile.runtime
    network_mode: none
    command: ["node", "--version"]
  mcp-image:
    image: "${LOOP_MCP_IMAGE:-loop-mcp:0.1}"
    build:
      context: .
      dockerfile: Dockerfile.mcp
    network_mode: none
    command: ["node", "--version"]
  runtime-broker:
    build:
      context: .
      dockerfile: Dockerfile.runtime-broker
    restart: unless-stopped
    environment:
      LOOP_RUNTIME_TOKEN: "${LOOP_RUNTIME_TOKEN:?Generate a runtime token first}"
      LOOP_RUNTIME_IMAGE: "${LOOP_RUNTIME_IMAGE:-loop-runtime:0.2}"
      LOOP_MCP_IMAGE: "${LOOP_MCP_IMAGE:-loop-mcp:0.1}"
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      runtime-image:
        condition: service_completed_successfully
      mcp-image:
        condition: service_completed_successfully
